aid: bighat-biosciences
name: BigHat Biosciences
description: >-
  BigHat Biosciences is a biotechnology company that pairs machine learning with a
  high-throughput, fully integrated wet lab to design next-generation antibody-based
  therapeutics. Its platform closes the loop between in-silico antibody design and
  in-house synthesis and characterization, generating proprietary experimental data
  that trains its models and speeds the discovery of biologics with improved developability.
  The company has publicly discussed its Reccy antibody design studio (RADS) and has
  entered machine-learning-enabled biologics collaborations with Eli Lilly (including
  Lilly TuneLab), Johnson & Johnson, and Lonza/Synaffix. BigHat is a private, venture-backed
  company (8VC, a16z) and maintains a public GitHub organization of open-source
  computational-biology tooling. It does not currently publish a public developer API.
